help:
  title: 🔮 Menu de Ajuda do Bot de Tarot
  description: Aprenda como usar os recursos do bot de tarot
  main: 🃏 COMANDOS PRINCIPAIS
  main_desc: '`!tarot [spread] [pergunta]` - Obter uma leitura `!card [nome]` - Detalhes da carta `!cards [categoria]` - Listar cartas `!daily` - Sua carta diária `!weekly` - Leitura semanal `!tarotdm [spread]
    [pergunta]` - Leitura via DM `!history [número]` - Leituras anteriores `!insight` - Insights pessoais `!journal add [id] [nota]` - Adicionar entrada no diário `!journal` - Ver diário `!exportdata` -
    Exportar dados `!deletedata confirm` - Excluir dados `!language [id/en]` - Alterar idioma `!mode [simple/deep/gentle/direct]` - Alterar modo `!aimodels` - Listar modelos de IA `!aimodel [model_id]`
    - Selecionar modelo de IA `!aion` / `!aioff` - Ativar/desativar IA `!aistatus` - Status da IA `!botinfo` - Info do bot `!firebase` - Status do Firebase `!help` - Este menu de ajuda'
  spreads: 📊 TIPOS DE SPREAD
  spreads_desc: • `single` - 1 carta, orientação rápida • `three` - 3 cartas, passado-presente-futuro • `celtic` - 10 cartas, leitura abrangente • `relationship` - 5 cartas, dinâmica de relacionamento •
    `career` - 6 cartas, caminho profissional • `yesno` - 3 cartas, orientação sim/não • `weekly` - 5 cartas, orientação semanal • `love` - 6 cartas, insights sobre amor • `decision` - 5 cartas, ajuda para
    decisões • `selfcare` - 5 cartas, autocuidado • `shadow` - 5 cartas, trabalho de sombra
  modes: 🎭 MODOS DE LEITURA
  modes_desc: • `simple` - Conciso e fácil de entender • `deep` - Interpretação detalhada • `gentle` - Tom suave • `direct` - Respostas diretas
  cards: 🎴 CATEGORIAS DE CARTAS
  cards_desc: • `major` - Arcanos Maiores (22 cartas) • `wands` - Naipe de Paus (14 cartas) • `cups` - Naipe de Copas (14 cartas) • `swords` - Naipe de Espadas (14 cartas) • `pentacles` - Naipe de Ouros
    (14 cartas) • `all` - Baralho completo (78 cartas)
  examples: 💡 EXEMPLOS
  examples_desc: • `!tarot three Vou encontrar amor?` • `!card The Fool` • `!cards major` • `!tarot relationship` • `!daily` • `!weekly` • `!language pt` • `!mode deep` • `!aimodel kr/claude-sonnet-4.5`
    • `!tarotdm three Pergunta secreta`
  tips: 💭 DICAS PARA LEITURAS MELHORES
  tips_desc: • Foque em sua pergunta antes de perguntar • Mantenha a mente aberta para interpretações • Use spreads diferentes para necessidades diferentes • Revise seu histórico para identificar padrões
    • O tarot reflete possibilidades, não certezas
  footer_text: O tarot é um espelho para o seu subconsciente • Seja paciente com a jornada
  category_dict:
    commands:
      label: 📖 Comandos principais
      items:
      - name: '!tarot [tiragem] [pergunta]'
        desc: Fazer leitura
