botinfo:
  title: 🤖 Bot de Tarot
  description: Seu guia digital para a sabedoria do tarot
  statistics: 📊 Estatísticas
  statistics_desc: '• Total de Usuários: **{0}**

    • Leituras Realizadas: **{1}**

    • Cartas no Baralho: **{2}**

    • Spreads Disponíveis: **{3}**'
  card_stats: 🎴 Estatísticas de Cartas
  card_stats_desc: 'Carta Mais Comum: **{0}** ({1} aparições)

    Arcanos Maiores: **{2}** cartas

    Arcanos Menores: **{3}** cartas'
  technical: ⚙️ Informações Técnicas
  technical_desc: '• Status: Online ✅

    • Versão: 2.5.0

    • Desenvolvedor: __xvey

    • Suporte: Use `!help`'
  features: ✨ Recursos
  feature_picker: Escolha um recurso no menu abaixo para ler a descrição completa.
  feature_picker_short: Escolha um recurso…
  feature_detail_title: 📖 {name}
  features_dict:
    cards:
      label: 🎴 78 cartas de tarot detalhadas
      desc: 'Acesse 78 cartas de tarot completas com significados, palavras-chave, explicações por posição e orientação (normal/invertida). Use `!card [nome]` ou `/card [nome]`.

        '
      short: 78 cartas completas com significados, palavras-chave e orientações.
    commands:
      label: ⚡ Comandos prefixo e slash
      desc: 'O bot suporta dois estilos: prefixo `!comando` (ex. `!tarot`) e slash `/comando` (ex. `/tarot`). Ambos funcionam igual — escolha o seu favorito!

        '
      short: 'Dois estilos: prefixo `!cmd` e slash `/cmd`. Escolha o seu!'
    spreads:
      label: 📊 11 tipos de tiragem
      desc: 'Escolha entre 11 tiragens: one, two, three, four, five, six, seven, eight, love, career e celtic. Cada uma tem layout e quantidade de cartas únicos — de 1 a 10 cartas.

        '
      short: '11 tiragens: one, two, three, four, five, six, seven, eight, love, career, celtic.'
    card_explain:
      label: 📖 Explicações completas
      desc: 'Cada carta tem explicação detalhada baseada na posição na tiragem e orientação (normal/invertida). Significados contextuais (carreira, amor, espiritual) também disponíveis.

        '
      short: Explicação detalhada por carta, posição, orientação e contexto.
    languages:
      label: 🌐 Suporte multilíngue
      desc: 'O bot suporta 5 idiomas: 🇮🇩 Bahasa Indonesia (padrão), 🇬🇧 English, 🇵🇹 Português, 🇪🇸 Español, 🇩🇪 Deutsch. Troque com `!language [código]`, ex. `!language pt`.

        '
      short: '5 idiomas: 🇮🇩 🇬🇧 🇵🇹 🇪🇸 🇩🇪. Troque com `!language [código]`.'
    modes:
      label: 🎭 4 modos de leitura
      desc: 'Escolha o modo ideal: `simple` (conciso), `deep` (aprofundado), `gentle` (suave e acolhedor) ou `direct` (direto e sem rodeios). Troque com `!mode [modo]`.

        '
      short: '4 modos: `simple`, `deep`, `gentle`, `direct`. Troque com `!mode [modo]`.'
    ai_interpret:
      label: ✨ Interpretação por IA
      desc: 'Interpretação extra por IA (9Router). Você pode escolher o modelo com `!aimodel [model_id]` ou ver a lista com `!aimodels`. Desative com `!aioff`.

        '
      short: Interpretação extra por IA. Escolha o modelo com `!aimodel`.
    daily:
      label: 📅 Leitura diária
      desc: 'Receba uma carta diária para reflexão. Cooldown de 24 horas. Use `!daily` ou `/daily`.

        '
      short: Uma carta diária para reflexão. Cooldown 24h.
    weekly:
      label: 📆 Leitura semanal
      desc: 'Receba um resumo de 7 cartas para a semana. Cooldown de 7 dias. Use `!weekly` ou `/weekly`.

        '
      short: Resumo semanal de 7 cartas. Cooldown 7 dias.
    history:
      label: 💾 Histórico & insights
      desc: 'Todas as leituras são salvas automaticamente. Veja com `!history` e receba insights pessoais dos padrões que surgem.

        '
      short: Todas as leituras salvas automaticamente. Veja com `!history`.
    images:
      label: 🖼️ Imagens & layouts
      desc: 'Cada carta tem sua imagem (78 imagens únicas Rider-Waite). Leituras geram imagens de layout automaticamente mostrando cada carta na sua posição.

        '
      short: 78 imagens Rider-Waite + layouts automáticos.
    search:
      label: 🔍 Busca de cartas
      desc: 'Encontre uma carta pelo nome com `!card [nome]` ou `/card [nome]`. Você também pode usar `!cards` para ver a lista completa.

        '
      short: Encontre cartas pelo nome com `!card [nome]`.
    data_control:
      label: 🔒 Exportar/apagar dados
      desc: 'Você é dono dos seus dados. Exporte todos os dados pessoais com `!export`, ou apague permanentemente com `!delete`. (Local & Firebase se ativado.)

        '
      short: Você é dono dos dados. Exporte `!export`, apague `!delete`.
    journal:
      label: 📝 Diário de reflexão
      desc: 'Adicione notas pessoais às suas leituras com `!journal add [reading_id] [nota]`. Veja todas com `!journal`. A reflexão aprofunda o insight.

        '
      short: Notas pessoais para leituras. `!journal add [id] [nota]`.
    privacy:
      label: 🔒 Modo privacidade (DM)
      desc: 'Para leituras sensíveis, use `!tarotdm` — o bot envia o resultado por DM, não visível no servidor.

        '
      short: 'Modo DM para leituras sensíveis: `!tarotdm`.'
    cloud:
      label: ☁️ Firestore Cloud Storage
      desc: 'Se o Firebase estiver ativado, seus dados sincronizam automaticamente com a nuvem Firestore — acessível de qualquer lugar e mantido seguro.

        '
      short: Sincronização automática com Firestore se Firebase estiver ativo.
  footer: O tarot é uma ferramenta de reflexão, não de previsão
  feature_not_found: ❌ Recurso não encontrado.
