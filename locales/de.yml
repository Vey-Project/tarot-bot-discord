botinfo:
  title: 🤖 Tarot-Bot
  description: Dein digitaler Guide zur Tarot-Weisheit
  statistics: 📊 Statistik
  statistics_desc: '• Gesamtbenutzer: **{0}**

    • Legungen Gegeben: **{1}**

    • Karten im Deck: **{2}**

    • Verfügbare Spreads: **{3}**'
  card_stats: 🎴 Karten-Statistik
  card_stats_desc: 'Häufigste Karte: **{0}** ({1} Erscheinungen)

    Große Arkana: **{2}** Karten

    Kleine Arkana: **{3}** Karten'
  technical: ⚙️ Technische Info
  technical_desc: '• Status: Online ✅

    • Version: 2.5.0

    • Entwickler: __xvey

    • Support: Verwende `!help`'
  features: ✨ Funktionen
  feature_picker: Wähle eine Funktion aus dem Menü unten, um die vollständige Beschreibung
    zu lesen.
  feature_picker_short: Funktion wählen…
  feature_detail_title: 📖 {name}
  features_dict:
    cards:
      label: 🎴 78 detaillierte Tarotkarten
      desc: 'Zugriff auf 78 vollständige Tarotkarten mit Bedeutungen, Schlüsselwörtern,
        positionsspezifischen Erklärungen und Orientierung (aufrecht/umgekehrt). Nutze
        `!card [Name]` oder `/card [Name]`.

        '
      short: 78 vollständige Karten mit Bedeutungen, Schlüsselwörtern und Orientierung.
    commands:
      label: ⚡ Präfix- und Slash-Befehle
      desc: 'Der Bot unterstützt zwei Befehlsarten: Präfix `!befehl` (z.B. `!tarot`)
        und Slash `/befehl` (z.B. `/tarot`). Beide funktionieren gleich — wähle deinen
        Favoriten!

        '
      short: 'Zwei Stile: Präfix `!cmd` und Slash `/cmd`. Wähle deinen Favoriten!'
    spreads:
      label: 📊 11 verschiedene Legesysteme
      desc: 'Wähle aus 11 Legesystemen: one, two, three, four, five, six, seven, eight,
        love, career und celtic. Jedes hat ein eigenes Layout und Kartenzahl — von
        1 bis 10 Karten.

        '
      short: '11 Legesysteme: one, two, three, four, five, six, seven, eight, love,
        career, celtic.'
    card_explain:
      label: 📖 Vollständige Erklärungen
      desc: 'Jede Karte hat eine detaillierte Erklärung basierend auf ihrer Position
        im Legesystem und Orientierung (aufrecht/umgekehrt). Kontextuelle Bedeutungen
        (Karriere, Liebe, spirituell) ebenfalls verfügbar.

        '
      short: Detaillierte Erklärung pro Karte, Position, Orientierung und Kontext.
    languages:
      label: 🌐 Mehrsprachiger Support
      desc: 'Der Bot unterstützt 5 Sprachen: 🇮🇩 Bahasa Indonesia (Standard), 🇬🇧 English,
        🇵🇹 Português, 🇪🇸 Español, 🇩🇪 Deutsch. Wechsle mit `!language [Code]`, z.B.
        `!language de`.

        '
      short: '5 Sprachen: 🇮🇩 🇬🇧 🇵🇹 🇪🇸 🇩🇪. Wechsle mit `!language [Code]`.'
    modes:
      label: 🎭 4 Lesemodi
      desc: 'Wähle den passenden Modus: `simple` (knapp), `deep` (gründlich), `gentle`
        (sanft & unterstützend) oder `direct` (direkt & ohne Umschweife). Wechsle
        mit `!mode [modus]`.

        '
      short: '4 Modi: `simple`, `deep`, `gentle`, `direct`. Wechsle mit `!mode [modus]`.'
    ai_interpret:
      label: ✨ KI-Interpretation
      desc: 'Zusätzliche Interpretation durch KI (9Router). Du kannst das Modell mit
        `!aimodel [model_id]` wählen oder die Liste mit `!aimodels` sehen. Ausschalten
        mit `!aioff`.

        '
      short: Zusätzliche KI-Interpretation. Wähle Modell mit `!aimodel`.
    daily:
      label: 📅 Tageskarten
      desc: 'Erhalte eine tägliche Karte zur Reflexion. 24-Stunden-Cooldown. Nutze
        `!daily` oder `/daily`.

        '
      short: Eine tägliche Karte zur Reflexion. 24h Cooldown.
    weekly:
      label: 📆 Wochenkarten
      desc: 'Erhalte eine 7-Karten-Zusammenfassung für die Woche. 7-Tage-Cooldown.
        Nutze `!weekly` oder `/weekly`.

        '
      short: 7-Karten-Wochenübersicht. 7-Tage-Cooldown.
    history:
      label: 💾 Verlauf & Erkenntnisse
      desc: 'Alle Legungen werden automatisch gespeichert. Sieh sie mit `!history`
        und erhalte persönliche Erkenntnisse aus den Mustern.

        '
      short: Alle Legungen automatisch gespeichert. Sieh mit `!history`.
    images:
      label: 🖼️ Kartenbilder & Layouts
      desc: 'Jede Karte hat ihr eigenes Bild (78 einzigartige Rider-Waite-Bilder).
        Legungen erzeugen automatisch Layout-Bilder, die jede Karte an ihrer Position
        zeigen.

        '
      short: 78 Rider-Waite-Bilder + automatische Layouts.
    search:
      label: 🔍 Kartensuche
      desc: 'Finde eine Karte nach Namen mit `!card [Name]` oder `/card [Name]`. Du
        kannst auch `!cards` für die vollständige Liste nutzen.

        '
      short: Finde Karten nach Namen mit `!card [Name]`.
    data_control:
      label: 🔒 Daten exportieren/löschen
      desc: 'Du besitzt deine Daten. Exportiere alle persönlichen Daten mit `!export`,
        oder lösche sie dauerhaft mit `!delete`. (Lokal & Firebase falls aktiviert.)

        '
