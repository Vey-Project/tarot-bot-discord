  title: 🔮 Tarot-Bot Hilfe-Menü
  description: Lerne, wie du die Funktionen des Tarot-Bots verwendest
  main: 🃏 HAUPTBEFEHLE
  main_desc: '`!tarot [spread] [frage]` - Legung erhalten `!card [name]` - Kartendetails
    `!cards [kategorie]` - Karten auflisten `!daily` - Deine Tageskarte `!weekly`
    - Wochen-Legung `!tarotdm [spread] [frage]` - Legung via DM `!history [anzahl]`
    - Frühere Legungen `!insight` - Persönliche Erkenntnisse `!journal add [id] [notiz]`
    - Tagebucheintrag hinzufügen `!journal` - Tagebuch ansehen `!exportdata` - Daten
    exportieren `!deletedata confirm` - Daten löschen `!language [id/en]` - Sprache
    ändern `!mode [simple/deep/gentle/direct]` - Modus ändern `!aimodels` - KI-Modelle
    auflisten `!aimodel [model_id]` - KI-Modell wählen `!aion` / `!aioff` - KI aktivieren/deaktivieren
    `!aistatus` - KI-Status `!botinfo` - Bot-Info `!firebase` - Firebase-Status `!help`
    - Dieses Hilfemenü'
  spreads: 📊 SPREAD-TYPEN
  spreads_desc: • `single` - 1 Karte, schnelle Orientierung • `three` - 3 Karten,
