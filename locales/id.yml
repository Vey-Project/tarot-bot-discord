botinfo:
  title: 🤖 Tarot Bot
  description: Panduan digitalmu untuk kebijaksanaan tarot
  statistics: 📊 Statistik
  statistics_desc: '• Total Pengguna: **{0}**

    • Reading Diberikan: **{1}**

    • Kartu di Dek: **{2}**

    • Spread Tersedia: **{3}**'
  card_stats: 🎴 Statistik Kartu
  card_stats_desc: 'Kartu Paling Sering: **{0}** ({1} muncul)

    Major Arcana: **{2}** kartu

    Minor Arcana: **{3}** kartu'
  technical: ⚙️ Info Teknis
  technical_desc: '• Status: Online ✅

    • Versi: 3.1.0

    • Developer: __xvey

    • Dukungan: Gunakan `!help`'
  features: ✨ Fitur
  feature_picker: Pilih fitur dari menu di bawah untuk membaca penjelasan detailnya.
  feature_picker_short: Pilih fitur…
  feature_detail_title: 📖 {name}
  features_dict:
    cards:
      label: 🎴 78 kartu tarot detail
      desc: 'Akses 78 kartu tarot lengkap dengan makna, kata kunci, penjelasan posisi, dan orientasi (upright/reversed). Gunakan `!card [nama]` atau `/card [nama]` untuk info lengkap satu kartu.

        '
      short: 78 kartu tarot dengan makna, kata kunci, posisi, dan orientasi lengkap.
    commands:
      label: ⚡ Perintah prefix dan slash
      desc: 'Bot mendukung dua gaya perintah: prefix `!command` (contoh `!tarot`) dan slash `/command` (contoh `/tarot`). Keduanya memberikan hasil yang sama — pilih yang kamu suka!

        '
      short: 'Dua gaya: prefix `!command` dan slash `/command`. Pilih favoritmu!'
    spreads:
      label: 📊 11 jenis spread berbeda
      desc: 'Pilih dari 11 spread: one, two, three, four, five, six, seven, eight, love, career, dan celtic. Masing-masing punya tata letak dan jumlah kartu berbeda — dari 1 kartu sampai 10 kartu.

        '
      short: '11 spread: one, two, three, four, five, six, seven, eight, love, career, celtic.'
    card_explain:
      label: 📖 Penjelasan lengkap setiap kartu
      desc: 'Setiap kartu punya penjelasan detail berdasarkan posisi di spread dan orientasi (upright/reversed). Makna per konteks (karier, cinta, spiritual) juga tersedia.

        '
      short: Penjelasan detail per kartu, posisi, orientasi, dan konteks (karier/cinta).
    languages:
      label: 🌐 Dukungan multi-bahasa
      desc: 'Bot mendukung 5 bahasa: 🇮🇩 Bahasa Indonesia (default), 🇬🇧 English, 🇵🇹 Português, 🇪🇸 Español, 🇩🇪 Deutsch. Ganti dengan `!language [kode]`, mis. `!language en`.

        '
      short: '5 bahasa: 🇮🇩 🇬🇧 🇵🇹 🇪🇸 🇩🇪. Ganti pakai `!language [kode]`.'
    modes:
      label: 🎭 4 mode reading berbeda
      desc: 'Pilih mode yang cocok: `simple` (ringkas), `deep` (mendalam), `gentle` (lembut & suportif), atau `direct` (tegas & apa adanya). Ganti dengan `!mode [mode]`.

        '
      short: '4 mode: `simple`, `deep`, `gentle`, `direct`. Ganti pakai `!mode [mode]`.'
    ai_interpret:
      label: ✨ Interpretasi AI
      desc: 'Interpretasi tambahan oleh AI (9Router). Kamu bisa pilih model AI yang dipakai lewat `!aimodel [model_id]` atau `!aimodels` untuk lihat daftar. Nonaktifkan dengan `!aioff`.

        '
      short: Interpretasi AI tambahan. Pilih model dengan `!aimodel`.
    daily:
      label: 📅 Reading harian
      desc: 'Dapatkan satu kartu harian sebagai refleksi untuk hari ini. Cooldown 24 jam. Pakai `!daily` atau `/daily`.

        '
      short: Satu kartu harian untuk refleksi. Cooldown 24 jam.
    weekly:
      label: 📆 Reading mingguan
      desc: 'Dapatkan ringkasan 7 kartu untuk minggu ini. Cooldown 7 hari. Pakai `!weekly` atau `/weekly`.

        '
      short: Ringkasan 7 kartu untuk minggu ini. Cooldown 7 hari.
    history:
      label: 💾 Riwayat & wawasan
      desc: 'Semua reading tersimpan otomatis. Lihat dengan `!history` dan dapatkan insight personal dari pola yang muncul.

        '
      short: Semua reading tersimpan otomatis. Lihat dengan `!history`.
    images:
      label: 🖼️ Gambar & layout kartu
      desc: 'Setiap kartu punya gambar asli (78 gambar unik dari Rider-Waite). Reading otomatis generate gambar layout posisi Spread.

        '
      short: 78 gambar Rider-Waite + layout spread otomatis.
    search:
      label: 🔍 Pencarian kartu
      desc: 'Cari kartu berdasarkan nama dengan `!card [nama]` atau `/card [nama]`. Bisa juga cari via `!cards` untuk lihat daftar semua kartu.

        '
      short: Cari kartu by nama dengan `!card [nama]`.
    data_control:
      label: 🔒 Ekspor/hapus data
      desc: 'Kamu pemilik data kamu. Ekspor semua data pribadi dengan `!export`, atau hapus permanen dengan `!delete`. (Lokal & Firebase jika aktif.)

        '
      short: Kamu pemilik data. Ekspor `!export`, hapus `!delete`.
    journal:
      label: 📝 Jurnal refleksi
      desc: 'Tambah catatan pribadi ke reading kamu dengan `!journal add [reading_id] [catatan]`. Lihat semua dengan `!journal`. Refleksi membantu memperdalam insight.

        '
      short: Catatan pribadi untuk reading. `!journal add [id] [catatan]`.
    privacy:
      label: 🔒 Mode privasi (DM)
      desc: 'Untuk reading yang sensitif, pakai `!tarotdm` — bot akan DM kamu hasilnya, tidak terlihat di server.

        '
      short: 'Mode DM untuk reading sensitif: `!tarotdm`.'
    cloud:
      label: ☁️ Firestore Cloud Storage
      desc: 'Jika Firebase diaktifkan, data kamu otomatis disinkronkan ke Firestore cloud — bisa diakses dari mana saja dan tetap aman.

        '
      short: Sync otomatis ke Firestore cloud jika Firebase aktif.
  footer: Tarot adalah alat refleksi, bukan ramalan
  feature_not_found: ❌ Fitur tidak ditemukan.
