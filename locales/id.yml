    data `!deletedata confirm` - Hapus data `!language [id/en]` - Ubah bahasa `!mode [simple/deep/gentle/direct]` - Ubah mode `!aimodels` - Lihat daftar model AI `!aimodel [model_id]` - Pilih model AI `!aion`
    / `!aioff` - Aktif/nonaktif AI `!aistatus` - Status AI `!botinfo` - Info bot `!firebase` - Status Firebase `!help` - Menu bantuan ini'
  spreads: 📊 JENIS SPREAD
