help:
  title: 🔮 Menu Bantuan Tarot Bot
  description: Pelajari cara menggunakan fitur bot tarot
  main: 🃏 PERINTAH UTAMA
  main_desc: '`!tarot [spread] [pertanyaan]` - Dapatkan reading `!card [nama]` - Detail kartu `!cards [kategori]` - Daftar kartu `!daily` - Kartu harianmu `!weekly` - Reading mingguan `!tarotdm [spread]
