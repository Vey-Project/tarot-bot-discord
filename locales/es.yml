help:
  title: 🔮 Menú de Ayuda del Bot de Tarot
  description: Aprende cómo usar las funciones del bot de tarot
  main: 🃏 COMANDOS PRINCIPALES
  main_desc: '`!tarot [spread] [pregunta]` - Obtener una lectura `!card [nombre]`
    - Detalles de la carta `!cards [categoría]` - Listar cartas `!daily` - Tu carta
    diaria `!weekly` - Lectura semanal `!tarotdm [spread] [pregunta]` - Lectura vía
    DM `!history [número]` - Lecturas anteriores `!insight` - Perspectivas personales
    `!journal add [id] [nota]` - Añadir entrada al diario `!journal` - Ver diario
    `!exportdata` - Exportar datos `!deletedata confirm` - Eliminar datos `!language
    [id/en]` - Cambiar idioma `!mode [simple/deep/gentle/direct]` - Cambiar modo `!aimodels`
    - Listar modelos de IA `!aimodel [model_id]` - Seleccionar modelo de IA `!aion`
    / `!aioff` - Activar/desactivar IA `!aistatus` - Estado de IA `!botinfo` - Info
    del bot `!firebase` - Estado de Firebase `!help` - Este menú de ayuda'
  spreads: 📊 TIPOS DE SPREAD
  spreads_desc: • `single` - 1 carta, orientación rápida • `three` - 3 cartas, pasado-presente-futuro
    • `celtic` - 10 cartas, lectura completa • `relationship` - 5 cartas, dinámica
    de relaciones • `career` - 6 cartas, camino profesional • `yesno` - 3 cartas,
    orientación sí/no • `weekly` - 5 cartas, orientación semanal • `love` - 6 cartas,
    perspectivas de amor • `decision` - 5 cartas, ayuda para decisiones • `selfcare`
    - 5 cartas, autocuidado • `shadow` - 5 cartas, trabajo de sombra
  modes: 🎭 MODOS DE LECTURA
  modes_desc: • `simple` - Conciso y fácil de entender • `deep` - Interpretación detallada
    • `gentle` - Tono suave • `direct` - Respuestas directas
  cards: 🎴 CATEGORÍAS DE CARTAS
  cards_desc: • `major` - Arcanos Mayores (22 cartas) • `wands` - Palo de Bastos (14
    cartas) • `cups` - Palo de Copas (14 cartas) • `swords` - Palo de Espadas (14
    cartas) • `pentacles` - Palo de Oros (14 cartas) • `all` - Baraja completa (78
    cartas)
  examples: 💡 EJEMPLOS
  examples_desc: • `!tarot three ¿Encontraré amor?` • `!card The Fool` • `!cards major`
    • `!tarot relationship` • `!daily` • `!weekly` • `!language es` • `!mode deep`
    • `!aimodel kr/claude-sonnet-4.5` • `!tarotdm three Pregunta secreta`
  tips: 💭 CONSEJOS PARA MEJORES LECTURAS
  tips_desc: • Enfoca tu pregunta antes de preguntar • Mantén la mente abierta a las
    interpretaciones • Usa diferentes spreads para diferentes necesidades • Revisa
    tu historial para ver patrones • El tarot refleja posibilidades, no certezas
  footer_text: El tarot es un espejo para tu subconsciente • Sé paciente con el viaje
  category_dict:
