botinfo:
  title: 🤖 Bot de Tarot
  description: Tu guía digital para la sabiduría del tarot
  statistics: 📊 Estadísticas
  statistics_desc: '• Total de Usuarios: **{0}**

    • Lecturas Realizadas: **{1}**

    • Cartas en la Baraja: **{2}**

    • Spreads Disponibles: **{3}**'
  card_stats: 🎴 Estadísticas de Cartas
  card_stats_desc: 'Carta Más Común: **{0}** ({1} apariciones)

    Arcanos Mayores: **{2}** cartas

    Arcanos Menores: **{3}** cartas'
  technical: ⚙️ Información Técnica
  technical_desc: '• Estado: En línea ✅

    • Versión: 2.5.0

    • Desarrollador: __xvey

    • Soporte: Usa `!help`'
  features: ✨ Características
  feature_picker: Elige una función del menú de abajo para leer su descripción completa.
  feature_picker_short: Elige una función…
  feature_detail_title: 📖 {name}
  features_dict:
    cards:
      label: 🎴 78 cartas de tarot detalladas
      desc: 'Accede a 78 cartas de tarot completas con significados, palabras clave,
        explicaciones por posición y orientación (normal/invertida). Usa `!card [nombre]`
        o `/card [nombre]`.

        '
      short: 78 cartas completas con significados, palabras clave y orientaciones.
    commands:
      label: ⚡ Comandos prefijo y slash
      desc: 'El bot soporta dos estilos: prefijo `!comando` (ej. `!tarot`) y slash
        `/comando` (ej. `/tarot`). Ambos funcionan igual — ¡elige tu favorito!

        '
      short: 'Dos estilos: prefijo `!cmd` y slash `/cmd`. ¡Elige tu favorito!'
    spreads:
      label: 📊 11 tipos de tirada
      desc: 'Elige entre 11 tiradas: one, two, three, four, five, six, seven, eight,
        love, career y celtic. Cada una tiene layout y cantidad de cartas únicos —
        de 1 a 10 cartas.

        '
      short: '11 tiradas: one, two, three, four, five, six, seven, eight, love, career,
        celtic.'
    card_explain:
      label: 📖 Explicaciones completas
      desc: 'Cada carta tiene explicación detallada según su posición en la tirada
        y orientación (normal/invertida). Significados contextuales (carrera, amor,
        espiritual) también disponibles.

        '
      short: Explicación detallada por carta, posición, orientación y contexto.
    languages:
      label: 🌐 Soporte multiidioma
      desc: 'El bot soporta 5 idiomas: 🇮🇩 Bahasa Indonesia (predeterminado), 🇬🇧 English,
        🇵🇹 Português, 🇪🇸 Español, 🇩🇪 Deutsch. Cambia con `!language [código]`, ej.
        `!language es`.

        '
      short: '5 idiomas: 🇮🇩 🇬🇧 🇵🇹 🇪🇸 🇩🇪. Cambia con `!language [código]`.'
    modes:
      label: 🎭 4 modos de lectura
      desc: 'Elige el modo adecuado: `simple` (conciso), `deep` (profundo), `gentle`
        (suave y acogedor) o `direct` (directo y sin rodeos). Cambia con `!mode [modo]`.

        '
      short: '4 modos: `simple`, `deep`, `gentle`, `direct`. Cambia con `!mode [modo]`.'
    ai_interpret:
      label: ✨ Interpretación con IA
      desc: 'Interpretación extra por IA (9Router). Puedes elegir el modelo con `!aimodel
        [model_id]` o ver la lista con `!aimodels`. Desactiva con `!aioff`.

        '
      short: Interpretación extra por IA. Elige el modelo con `!aimodel`.
    daily:
      label: 📅 Lectura diaria
      desc: 'Recibe una carta diaria para reflexión. Cooldown de 24 horas. Usa `!daily`
        o `/daily`.

        '
      short: Una carta diaria para reflexión. Cooldown 24h.
    weekly:
      label: 📆 Lectura semanal
      desc: 'Recibe un resumen de 7 cartas para la semana. Cooldown de 7 días. Usa
        `!weekly` o `/weekly`.

        '
      short: Resumen semanal de 7 cartas. Cooldown 7 días.
    history:
      label: 💾 Historial e insights
      desc: 'Todas las lecturas se guardan automáticamente. Ve con `!history` y obtén
        insights personales de los patrones que surgen.

        '
      short: Todas las lecturas guardadas automáticamente. Ve con `!history`.
    images:
      label: 🖼️ Imágenes y layouts
      desc: 'Cada carta tiene su imagen (78 imágenes únicas Rider-Waite). Las lecturas
        generan imágenes de layout automáticamente mostrando cada carta en su posición.

        '
      short: 78 imágenes Rider-Waite + layouts automáticos.
    search:
      label: 🔍 Búsqueda de cartas
      desc: 'Encuentra una carta por nombre con `!card [nombre]` o `/card [nombre]`.
        También puedes usar `!cards` para ver la lista completa.

        '
      short: Encuentra cartas por nombre con `!card [nombre]`.
    data_control:
      label: 🔒 Exportar/borrar datos
      desc: 'Tú eres dueño de tus datos. Exporta todos los datos personales con `!export`,
        o bórralos permanentemente con `!delete`. (Local & Firebase si está activado.)

        '
      short: Tú eres dueño de tus datos. Exporta `!export`, borra `!delete`.
    journal:
      label: 📝 Diario de reflexión
      desc: 'Añade notas personales a tus lecturas con `!journal add [reading_id]
        [nota]`. Ve todas con `!journal`. La reflexión profundiza el insight.

        '
      short: Notas personales para lecturas. `!journal add [id] [nota]`.
    privacy:
      label: 🔒 Modo privacidad (DM)
      desc: 'Para lecturas sensibles, usa `!tarotdm` — el bot te envía el resultado
        por DM, no visible en el servidor.

        '
      short: 'Modo DM para lecturas sensibles: `!tarotdm`.'
    cloud:
      label: ☁️ Firestore Cloud Storage
      desc: 'Si Firebase está activado, tus datos se sincronizan automáticamente con
        la nube Firestore — accesible desde cualquier lugar y mantenido seguro.

        '
      short: Sincronización automática a Firestore si Firebase está activo.
  footer: El tarot es una herramienta de reflexión, no de predicción
  feature_not_found: ❌ Función no encontrada.
firebase_status:
  title: ☁️ Estado de Firebase
