botinfo:
  title: 🤖 Tarot Bot
  description: Your digital guide to tarot wisdom
  statistics: 📊 Statistics
  statistics_desc: '• Total Users: **{0}**

    • Readings Given: **{1}**

    • Cards in Deck: **{2}**

    • Available Spreads: **{3}**'
  card_stats: 🎴 Card Statistics
  card_stats_desc: 'Most Common Card: **{0}** ({1} appearances)

    Major Arcana: **{2}** cards

    Minor Arcana: **{3}** cards'
  technical: ⚙️ Technical Info
  technical_desc: '• Status: Online ✅

    • Version: 2.5.0

    • Developer: __xvey

    • Support: Use `!help`'
  features: ✨ Features
  feature_picker: Pick a feature from the menu below to read its full description.
  feature_picker_short: Pick a feature…
  feature_detail_title: 📖 {name}
  features_dict:
    cards:
      label: 🎴 78 detailed tarot cards
      desc: 'Access 78 full tarot cards with meanings, keywords, position-specific explanations, and orientation (upright/reversed).
        Use `!card [name]` or `/card [name]` for full info on one card.

        '
      short: 78 full cards with meanings, keywords, positions, and orientation.
    commands:
      label: ⚡ Prefix and slash commands
      desc: 'The bot supports two command styles: prefix `!command` (e.g. `!tarot`) and slash `/command` (e.g. `/tarot`).
        Both work the same — pick what you prefer!

        '
      short: 'Two styles: prefix `!command` and slash `/command`. Pick your fav!'
    spreads:
      label: 📊 11 different spread types
      desc: 'Choose from 11 spreads: one, two, three, four, five, six, seven, eight, love, career, and celtic. Each has a
        unique layout and card count — from 1 card to 10 cards.

        '
      short: '11 spreads: one, two, three, four, five, six, seven, eight, love, career, celtic.'
    card_explain:
      label: 📖 Full card explanations
      desc: 'Every card has a detailed explanation based on its position in the spread and orientation (upright/reversed).
        Context meanings (career, love, spiritual) are also available.

        '
      short: Detailed per-card explanation by position, orientation, and context.
    languages:
      label: 🌐 Multi-language support
      desc: 'Bot supports 5 languages: 🇮🇩 Bahasa Indonesia (default), 🇬🇧 English, 🇵🇹 Português, 🇪🇸 Español, 🇩🇪 Deutsch. Switch
        with `!language [code]`, e.g. `!language id`.

        '
      short: '5 languages: 🇮🇩 🇬🇧 🇵🇹 🇪🇸 🇩🇪. Switch with `!language [code]`.'
    modes:
      label: 🎭 4 reading modes
      desc: 'Pick the mode that fits: `simple` (concise), `deep` (thorough), `gentle` (soft & supportive), or `direct` (straightforward
        & no-nonsense). Switch with `!mode [mode]`.

        '
      short: '4 modes: `simple`, `deep`, `gentle`, `direct`. Switch with `!mode [mode]`.'
    ai_interpret:
      label: ✨ AI interpretation
      desc: 'Extra interpretation by AI (9Router). You can pick the AI model with `!aimodel [model_id]` or `!aimodels` to
        see the list. Turn it off with `!aioff`.

        '
      short: Extra AI interpretation. Pick model with `!aimodel`.
    daily:
      label: 📅 Daily readings
      desc: 'Get one daily card for reflection. 24-hour cooldown. Use `!daily` or `/daily`.

        '
      short: One daily card for reflection. 24h cooldown.
    weekly:
      label: 📆 Weekly readings
      desc: 'Get a 7-card summary for the week. 7-day cooldown. Use `!weekly` or `/weekly`.

        '
      short: 7-card weekly summary. 7-day cooldown.
    history:
      label: 💾 History & insights
      desc: 'All readings are saved automatically. View with `!history` and get personal insights from the patterns that emerge.

        '
      short: All readings saved automatically. View with `!history`.
    images:
      label: 🖼️ Card images & layouts
      desc: 'Every card has its own image (78 unique Rider-Waite images). Readings auto-generate layout images showing each
        card in its spread position.

        '
      short: 78 Rider-Waite images + automatic spread layouts.
    search:
      label: 🔍 Card search
      desc: 'Find a card by name with `!card [name]` or `/card [name]`. You can also use `!cards` to see the full list.

        '
      short: Find cards by name with `!card [name]`.
    data_control:
      label: 🔒 Export/delete data
      desc: 'You own your data. Export all personal data with `!export`, or permanently delete it with `!delete`. (Local &
        Firebase if enabled.)

        '
      short: You own your data. Export `!export`, delete `!delete`.
    journal:
      label: 📝 Reflection journal
      desc: 'Add personal notes to your readings with `!journal add [reading_id] [note]`. View all with `!journal`. Reflection
        deepens insight.

        '
      short: Personal notes for readings. `!journal add [id] [note]`.
    privacy:
      label: 🔒 Privacy mode (DM)
      desc: 'For sensitive readings, use `!tarotdm` — the bot DMs you the result, not visible in the server.

        '
      short: 'DM mode for sensitive readings: `!tarotdm`.'
    cloud:
      label: ☁️ Firestore Cloud Storage
      desc: 'If Firebase is enabled, your data auto-syncs to Firestore cloud — accessible from anywhere and kept secure.

        '
      short: Auto-sync to Firestore cloud if Firebase is enabled.
  footer: Tarot is a tool for reflection, not prediction
  feature_not_found: ❌ Feature not found.
