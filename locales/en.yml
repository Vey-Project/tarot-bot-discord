help:
  title: 🔮 Tarot Bot Help Menu
  description: Learn how to use the tarot bot''s features
  main: 🃏 MAIN COMMANDS
  main_desc: '`!tarot [spread] [question]` - Get a reading `!card [name]` - Card details `!cards [category]` - List cards
    `!daily` - Your daily card `!weekly` - Weekly reading `!tarotdm [spread] [question]` - Reading via DM `!history [number]`
    - Past readings `!insight` - Personal insights `!journal add [id] [note]` - Add journal entry `!journal` - View journal
    `!exportdata` - Export data `!deletedata confirm` - Delete data `!language [id/en]` - Change language `!mode [simple/deep/gentle/direct]`
    - Change mode `!aimodels` - List AI models `!aimodel [model_id]` - Select AI model `!aion` / `!aioff` - Enable/disable
    AI `!aistatus` - AI status `!botinfo` - Bot info `!firebase` - Firebase status `!help` - This help menu'
  spreads: 📊 SPREAD TYPES
  spreads_desc: • `single` - 1 card, quick guidance • `three` - 3 cards, past-present-future • `celtic` - 10 cards, comprehensive
    reading • `relationship` - 5 cards, relationship dynamics • `career` - 6 cards, career path • `yesno` - 3 cards, yes/no
    guidance • `weekly` - 5 cards, weekly guidance • `love` - 6 cards, love insights • `decision` - 5 cards, decision help
    • `selfcare` - 5 cards, self-care • `shadow` - 5 cards, shadow work
  modes: 🎭 READING MODES
  modes_desc: • `simple` - Concise and easy to understand • `deep` - Detailed interpretation • `gentle` - Gentle tone • `direct`
    - Direct answers
  cards: 🎴 CARD CATEGORIES
  cards_desc: • `major` - Major Arcana (22 cards) • `wands` - Wands suit (14 cards) • `cups` - Cups suit (14 cards) • `swords`
    - Swords suit (14 cards) • `pentacles` - Pentacles suit (14 cards) • `all` - Complete deck (78 cards)
  examples: 💡 EXAMPLES
  examples_desc: • `!tarot three Will I find love?` • `!card The Fool` • `!cards major` • `!tarot relationship` • `!daily`
    • `!weekly` • `!language en` • `!mode deep` • `!aimodel kr/claude-sonnet-4.5` • `!tarotdm three Secret question`
  tips: 💭 TIPS FOR BETTER READINGS
  tips_desc: • Focus your question before asking • Keep an open mind to interpretations • Use different spreads for different
    needs • Review your history for patterns • Tarot reflects possibilities, not certainties
  footer_text: Tarot is a mirror to your subconscious • Be patient with the journey
